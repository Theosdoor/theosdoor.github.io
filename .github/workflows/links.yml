name: Check external links

# Weekly rather than per-PR: external sites flake, and a dead link is not a reason to block a deploy.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm pinned in package.json (signature-checked), Node, and
      # the frozen lockfile in one step.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm run build
      # LinkedIn, Scholar and X reject bot requests, so they always look dead.
      # Anchored: --exclude is an unanchored regex, so a bare 'x\.com' would
      # also skip netflix.com, linux.com and any other host ending in x.com.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --root-dir "${{ github.workspace }}/dist"
            --exclude '^https?://(www\.)?linkedin\.com/'
            --exclude '^https?://scholar\.google\.com/'
            --exclude '^https?://(www\.)?x\.com/'
            --accept '200..=299,403,429'
            'dist/**/*.html'
