name: Check external links

# Weekly rather than per-PR: external sites flake, and a dead link is not a reason to block a deploy.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm ci
      - run: pnpm run build
      # LinkedIn and Scholar reject bot requests, so they always look dead.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --root-dir "${{ github.workspace }}/dist"
            --exclude 'linkedin\.com' --exclude 'scholar\.google\.com'
            --accept '200..=299,403,429'
            'dist/**/*.html'
