<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theo Farrell CV</title>
    <meta name="description"
        content="Curriculum Vitae of Theo Farrell — Durham University MSci Natural Sciences, AI safety researcher, NeurIPS author." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>
        // Apply saved sidebar state before render to avoid flash
        if (localStorage.getItem('sidebarHidden') === 'true') {
            document.documentElement.classList.add('sidebar-hidden-init');
        }
    </script>
</head>

<body>

    <aside>
        <div>
            <p class="sidebar-label">Curriculum Vitae</p>
            <h1 class="sidebar-name">Theo<br /><em>Farrell</em></h1>
            <div class="divider"></div>

            <div class="sidebar-meta">
                <span class="label">Location</span>
                Manchester, UK

                <span class="label">Phone</span>
                (+44) 7596 102384

                <span class="label">Email</span>
                <a href="mailto:theo.farrell99@outlook.com">theo.farrell99 'at' outlook.com</a>
            </div>

            <!-- Social links -->
            <div class="social-links">
                <!-- LinkedIn -->
                <a class="social-link" href="https://www.linkedin.com/in/theofarrell/" target="_blank" rel="noopener"
                    title="LinkedIn">
                    <img src="icons/linkedin.svg" alt="LinkedIn" />
                </a>

                <!-- GitHub -->
                <a class="social-link" href="https://github.com/Theosdoor" target="_blank" rel="noopener"
                    title="GitHub">
                    <img src="icons/github.svg" alt="GitHub" />
                </a>

                <!-- Google Scholar -->
                <a class="social-link" href="https://scholar.google.com/citations?hl=en&user=wbiptScAAAAJ"
                    target="_blank" rel="noopener" title="Google Scholar">
                    <img src="icons/gscholar.svg" alt="Google Scholar" />
                </a>

                <!-- Website -->
                <a class="social-link" href="https://theosdoor.github.io" target="_blank" rel="noopener"
                    title="Website">
                    <img src="icons/globe.svg" alt="Website" />
                </a>
            </div>
        </div>

        <div class="sidebar-footer">
            <a class="dl-btn" href="TheoFarrell_CV.pdf" download>
                <span class="dl-icon"></span>
                Download PDF
            </a>
            <p class="build-stamp">Built from LaTeX source · auto-deployed</p>
        </div>
    </aside>

    <!-- Sidebar toggle tab (must be outside aside to avoid transform stacking context) -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Collapse sidebar" aria-expanded="true">
        <svg class="chevron" viewBox="0 0 6 10" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <polyline points="5,1 1,5 5,9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </button>

    <main>
        <!-- Mobile header -->
        <div class="top-bar">
            <div class="mobile-header">
                <span class="mobile-name">Theo <em>Farrell</em></span>
                <a class="mobile-dl" href="TheoFarrell_CV.pdf" download>&#8595; PDF</a>
            </div>
        </div>
        <iframe src="TheoFarrell_CV.pdf" title="Theo Farrell — Curriculum Vitae"></iframe>
    </main>

    <script>
        const toggle = document.getElementById('sidebarToggle');
        const body = document.body;

        // Apply persisted state
        if (localStorage.getItem('sidebarHidden') === 'true') {
            body.classList.add('sidebar-hidden');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.setAttribute('aria-label', 'Expand sidebar');
        }

        toggle.addEventListener('click', () => {
            const hidden = body.classList.toggle('sidebar-hidden');
            toggle.setAttribute('aria-expanded', String(!hidden));
            toggle.setAttribute('aria-label', hidden ? 'Expand sidebar' : 'Collapse sidebar');
            localStorage.setItem('sidebarHidden', String(hidden));
        });
    </script>

</body>

</html>
